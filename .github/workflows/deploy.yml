name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - "package.json"

permissions:
  contents: read

jobs:
  release:
    name: Create Tag & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ github.sha }}
      should_deploy: ${{ steps.version_changed.outputs.changed == 'true' && steps.tag_check.outputs.exists == 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get version from package.json
        id: pkg
        run: |
          VERSION=$(jq -r '.version' package.json)
          DESCRIPTION=$(jq -r '.description // empty' package.json)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "description<<EOF" >> $GITHUB_OUTPUT
          echo "$DESCRIPTION" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Check if version changed
        id: version_changed
        run: |
          PREV_JSON=$(git show HEAD~1:package.json 2>/dev/null || echo "{}")
          PREV_VERSION=$(echo "$PREV_JSON" | jq -r '.version // empty' 2>/dev/null || echo "")
          CURR_VERSION=${{ steps.pkg.outputs.version }}
          if [ "$PREV_VERSION" != "$CURR_VERSION" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Check tag does not already exist
        id: tag_check
        if: steps.version_changed.outputs.changed == 'true'
        run: |
          TAG=${{ steps.pkg.outputs.tag }}
          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Find the previous release
        id: previous
        if: |
          steps.version_changed.outputs.changed == 'true' &&
          steps.tag_check.outputs.exists == 'false'
        run: echo "tag=$(git tag --list --sort=-version:refname | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        id: notes
        if: |
          steps.version_changed.outputs.changed == 'true' &&
          steps.tag_check.outputs.exists == 'false'
        uses: thechelsuk/workflows/.github/actions/release-notes@main
        with:
          previous: ${{ steps.previous.outputs.tag }}
          description: ${{ steps.pkg.outputs.description }}

      - name: Create tag
        if: |
          steps.version_changed.outputs.changed == 'true' &&
          steps.tag_check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.pkg.outputs.tag }}
          git push origin ${{ steps.pkg.outputs.tag }}

      - name: Create GitHub Release
        if: |
          steps.version_changed.outputs.changed == 'true' &&
          steps.tag_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          name: ${{ steps.pkg.outputs.version }}
          body_path: ${{ steps.notes.outputs.notes_file }}
          draft: false
          prerelease: ${{ contains(steps.pkg.outputs.version, '-') }}
  deploy:
        name: Deploy Worker
        runs-on: ubuntu-latest
        needs: release
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  ref: ${{ needs.release.outputs.sha }}

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: Install dependencies
              run: npm install

            - name: Deploy to Cloudflare Workers
              uses: cloudflare/wrangler-action@v4
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  wranglerVersion: "4"
